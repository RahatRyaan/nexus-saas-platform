name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Test & Typecheck Server
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Server
        run: npm run typecheck --workspace=server

      - name: Run Server Unit & Integration Tests
        run: npm run test --workspace=server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/nexus_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_min_32_chars_long
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_min_32_chars_long

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Client (Vite)
        run: npm run build --workspace=client

  docker-build:
    name: Verify Docker Build with Root Context
    runs-on: ubuntu-latest
    needs: [test-server, build-client]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Server Docker Image
        run: docker build -f server/Dockerfile -t nexus-server .

      - name: Build Client Docker Image
        run: docker build -f client/Dockerfile -t nexus-client .
